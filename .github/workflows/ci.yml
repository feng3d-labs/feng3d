# 持续集成：lint / 单元测试 / 类型检查 / 构建 / 发布产物预演
#
# 覆盖范围说明：
# - 单元测试走根 `vitest run`（配置见 vitest.config.ts）：包含 packages/feng3d/src 下的
#   spec 与各子包 test/ 下的 spec。shortcut / terrain 所需的浏览器与 WebGPU 全局
#   由 vitest.setup.ts 补齐，因此它们也在覆盖内，不再被 exclude 静默跳过。
# - 各子包的 `build` / `types` 脚本当前都是 `tsc`（tsconfig 为 noEmit），
#   所以这两步实质是全仓类型检查，防止类型错误合入。
#   `types:packages` / `build:packages` 只跑 packages/<包> 这一层，
#   不含示例工作区（示例有既存类型错误，属独立事项，见 docs/CI.md）。
# - editor 有自己的 eslint 配置与 vue-tsc 类型检查，单独一步跑。
#
# 发布流程见 release.yml。

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']   # tag 推送交给 release.yml，避免同一提交跑两遍
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码检查（eslint，零警告）
        run: npm run lint:ci

      - name: 单元测试（全量）
        run: npm run test:run

      - name: 类型检查（各子包 tsc）
        run: npm run types:packages

      - name: 构建校验（各子包 build）
        run: npm run build:packages

      - name: 发布产物预演（npm pack 内容校验）
        # 用 --force 让「版本已发布过」的包也走一遍打包校验；该参数被限制为
        # 只能配合 --dry-run 使用，此步骤不会调用 npm publish。
        # 用 --no-build 复用上一步 build:packages 的产物，避免重复构建。
        # 目的：把「包里少了入口文件 / files 字段没覆盖产物」这类问题
        # 提前暴露在 PR 阶段，而不是等推 tag 正式发布时才发现。
        run: npm run release:dry-run -- --force --no-build

      - name: 检查工作区是否被构建污染
        # 构建（尤其 editor 的 vite build）会重写自动生成文件；
        # 若此处出现 diff，说明有构建产物被纳入版本控制或未被还原。
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建后有文件被修改，请检查是否有构建产物被纳入版本控制："
            git status --porcelain
            git diff --stat
            exit 1
          fi

  editor:
    name: 编辑器（lint + 类型检查）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 eslint-plugin-feng3d
        # 编辑器的 eslint.config.js import 了 eslint-plugin-feng3d（响应式纪律规则），
        # 而该包的 dist/ 在 .gitignore 中、干净检出后不存在——不先构建会报 ERR_MODULE_NOT_FOUND。
        run: npm run build --workspace eslint-plugin-feng3d

      - name: 编辑器 lint
        run: npm run lint --workspace feng3d-editor

      - name: 编辑器类型检查（vue-tsc，非阻塞）
        # 不设成门禁的原因：editor 通过 workspace 链接 import 的是 feng3d / polyfill 的
        # **源码**，vue-tsc 会顺着 import 深检这些库的源码，于是报出它们既有的类型错误
        # （View.ts 的 canvas 断言、StandardMaterial.ts 的 TextureField 收窄、
        # ClassUtils.ts 的未使用 @ts-expect-error 等），而非 editor 自身的问题。
        # 这些错误在库自己的 tsc 下不出现（其 tsconfig 关闭了 strictNullChecks 等），
        # 属于独立事项（见 docs/CI.md「已知缺口」）。
        # 这里保留执行并把错误摘要记进日志，但不让门禁变红——否则会长期红着并掩盖真问题。
        run: |
          set +e
          npm run type-check --workspace feng3d-editor 2>&1 | tee /tmp/editor-typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::编辑器类型检查未通过：当前报的是 feng3d/polyfill 源码既有类型错误，非 editor 自身，不计入本次门禁"
            echo "----- 错误摘要 -----"
            grep -E "error TS" /tmp/editor-typecheck.log | head -n 20 || true
          fi

  editor-e2e:
    name: 编辑器（浏览器 e2e）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright chromium 及系统依赖
        # 用 playwright 自带的 chromium（而非系统 Chrome），保证 CI 与本地一致
        run: npx playwright install --with-deps chromium

      - name: 编辑器浏览器 e2e
        # 覆盖「产物能否真正立起来」——issue #145 的主界面白屏（产物里裸导入
        # "feng3d" 无法解析）正是这类纯逻辑测试漏掉的缺陷。
        # 用例内部会先构建编辑器产物，再起包内静态服务器（等价于用户 npx feng3d-editor）。
        run: npm run test:e2e:editor

      - name: 启动编辑器 dev server（AI 桥接需要）
        # 桥接中间件挂在 dev server 上（bridge/vitePlugin.mjs），静态服务器没有它。
        # `--strictPort`：端口被占用时直接失败并打出日志，而不是悄悄漂到 3001——
        # 漂移会让下面的就绪探测永远等不到，报出来的是"120s 超时"这种与真实原因无关的错。
        # 后台起服务后轮询 /ping 确认就绪，再进入下一步——固定 sleep 在 CI 上不可靠。
        # 进程在步骤结束后仍存活，由 runner 在 job 收尾时清理。
        # 就绪探测用 `localhost` 而不是 `127.0.0.1`：Vite 绑的是 `localhost`，
        # 在只解析到 IPv6 环回（::1）的环境里，回落到 `127.0.0.1` 会直接 ECONNREFUSED，
        # 报出来却是"120s 未就绪"。桥接脚本自己也用 `localhost`，两边保持一致。
        run: |
          npm run dev --workspace feng3d-editor -- --port 3000 --strictPort > /tmp/editor-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/__editor-bridge/ping > /dev/null; then
              echo "dev server 已就绪（等待 ${i} 轮）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::编辑器 dev server 未在 120s 内就绪"
          tail -n 80 /tmp/editor-dev.log
          exit 1

      - name: AI 桥接端到端验收（从零搭场景 + 导出/导入往返等价）
        # issue #150：判据是「交付是否成立」而不是「调用有没有报错」——
        # 结构自洽（scene.validate 无 error）、导出→导入**往返等价**、画面有内容。
        # `--open` 让脚本自己用 Playwright 开页面（桥接是页面轮询模型，没有页面就全部超时）。
        # 这台 runner 没有 GPU，判据三（像素）会被跳过而不是判失败。
        run: node scripts/editor-e2e-scene.mjs --open

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-report
          path: |
            .verify/editor-report/
            .verify/editor-output/
            /tmp/editor-dev.log
          retention-days: 7
