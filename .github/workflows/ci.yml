# 持续集成：lint / 单元测试 / 类型检查 / 构建 / 发布产物预演
#
# 覆盖范围说明：
# - 单元测试走根 `vitest run`（配置见 vitest.config.ts）：包含 packages/feng3d/src 下的
#   spec 与各子包 test/ 下的 spec。shortcut / terrain 所需的浏览器与 WebGPU 全局
#   由 vitest.setup.ts 补齐，因此它们也在覆盖内，不再被 exclude 静默跳过。
# - 各子包的 `build` / `types` 脚本当前都是 `tsc`（tsconfig 为 noEmit），
#   所以这两步实质是全仓类型检查，防止类型错误合入。
#   `types:packages` / `build:packages` 只跑 packages/<包> 这一层，
#   不含示例工作区（示例有既存类型错误，属独立事项，见 docs/CI.md）。
# - editor 有自己的 eslint 配置与 vue-tsc 类型检查，单独一步跑。
#
# 发布流程见 release.yml。

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']   # tag 推送交给 release.yml，避免同一提交跑两遍
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码检查（eslint，零警告）
        run: npm run lint:ci

      - name: 文档相对链接（坏链会 404，但不报错也不让测试失败）
        # 文档移动/改名/归档后，正文里的旧路径是最容易被漏掉的东西——本次实测出 6 条：
        # FRAMEWORK_REFACTOR_PLAN.md 归档到 docs/archive/ 后 3 处仍用旧路径、
        # editor 的 AGENTS.md 少写 .ts 后缀、objectview 两处指向并不存在的包内 LICENSE。
        # 只查仓库内相对链接（外链不查），vendored 的 packages/editor/libs/ 已排除。
        run: node scripts/check-docs-links.mjs

      - name: effect 盘点与代码一致性（R5，issue #79）
        # 清单一旦与实际调用点脱节就会静默腐化：读者按清单判断「effect 已清零」，
        # 而代码里早已新增。旧清单停在 30 处、实际 54 处，且写着 WGPUBuffer「无生产者」。
        # 现在按文件比对数量，清单与代码不一致即失败。
        run: node scripts/check-effect-inventory.mjs

      - name: 模块级副作用（R2，issue #88）
        # 模块顶层 new Map/WeakMap/Set、启动型调用（定时器 / rAF / ticker 启动）、globalThis 写入一律禁止：
        # import 即执行的代价是缓存无法按需分配、副作用无法关闭、tree-shaking 无法判定模块可否整体消除。
        # 全仓 19 处顶层缓存已在 #88 清零，这里用 --strict 直接当门禁。
        run: node scripts/check-module-side-effects.mjs --strict
      - name: tree-shaking 产物校验（R2 验收，issue #238）
        # 静态检查只能证明「没有明显的模块级副作用」；这里真打一次包，断言未引用的
        # 重量级模块（terrain/webgpu/reactivity）不在产物里，并用「显式引入 terrain」
        # 的对照产物自证 marker 检测有效（否则断言可能恒真）。
        run: node scripts/check-tree-shaking.mjs
      - name: 文档现状标签（R11，issue #78）
        # FRAMEWORK_DESIGN.md 写的是目标态，读者照它评估完成度会系统性高估。
        # 每个 ## 章节必须有「> 现状：✅/🔶/⬜（证据）」标签，缺一个就失败。
        run: node scripts/check-doc-status-labels.mjs
      - name: 单元测试 + 覆盖率门禁（issue #74）
        # 同一批测试顺带出覆盖率，不再单独跑一次 test:run（省掉重复的插桩收集时间）。
        # 阈值是「防止覆盖率下降」的底线（实测基线向下 1 个百分点），不是达标线：
        # 各包现状分档与冲击 80% 的路径见 docs/CI.md。
        run: npm run test:coverage

      - name: 类型检查（各子包 tsc）
        run: npm run types:packages

      - name: 构建校验（各子包 build）
        run: npm run build:packages

      - name: 发布产物预演（npm pack 内容校验）
        # 用 --force 让「版本已发布过」的包也走一遍打包校验；该参数被限制为
        # 只能配合 --dry-run 使用，此步骤不会调用 npm publish。
        # 用 --no-build 复用上一步 build:packages 的产物，避免重复构建。
        # 目的：把「包里少了入口文件 / files 字段没覆盖产物」这类问题
        # 提前暴露在 PR 阶段，而不是等推 tag 正式发布时才发现。
        run: npm run release:dry-run -- --force --no-build

      - name: 检查工作区是否被构建污染
        # 构建（尤其 editor 的 vite build）会重写自动生成文件；
        # 若此处出现 diff，说明有构建产物被纳入版本控制或未被还原。
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建后有文件被修改，请检查是否有构建产物被纳入版本控制："
            git status --porcelain
            git diff --stat
            exit 1
          fi

  editor:
    name: 编辑器（lint + 类型检查）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 eslint-plugin-feng3d
        # 编辑器的 eslint.config.js import 了 eslint-plugin-feng3d（响应式纪律规则），
        # 而该包的 dist/ 在 .gitignore 中、干净检出后不存在——不先构建会报 ERR_MODULE_NOT_FOUND。
        run: npm run build --workspace eslint-plugin-feng3d

      - name: 编辑器 lint
        run: npm run lint --workspace feng3d-editor

      - name: 属性面板字段描述表是否为最新（issue #147）
        # 描述表由 scripts/gen-objectview-schema.mjs 从 packages/feng3d 的纯数据接口生成。
        # 这里重跑一次并与入库产物逐行比对：接口改了却没重新生成，面板会**悄悄**落后于类型
        # （新增字段不显示、改了类型仍用旧控件），而那只有真去点开面板才会发现。
        # 根规范 §15：每条规范必须有机器执行者——「字段来源是数据接口本身」这条就是它。
        run: node scripts/gen-objectview-schema.mjs --check

      - name: 模块级注册副作用（R2，issue #170）
        # 判据是「除应用入口外，编辑器源码的模块顶层不得有 registerXxx / setDefaultXxx /
        # createXxxComponent / installXxx 调用」——按 AST 只看模块顶层语句（函数内部不算）。
        # 为什么要门禁：加一个 Logic 类时顺手在文件末尾写 `registerLogic(...)` 是最自然的动作，
        # 而漏掉一个文件的后果是那个类型**静默失去行为**（logic() 返回 null），代码评审记不住。
        run: node scripts/check-editor-module-effects.mjs

      - name: AI 桥接一致性（工具表 ↔ 方法表 ↔ 文档）
        # issue #168：桥接一边是 MCP 工具定义、一边是编辑器里的方法表，两边靠人手对齐，
        # 漏一个的后果是「AI 以为有这个工具，调用却 404」——只有真去调才发现。
        # 这一步离线可跑（不需要页面），把工具定义、接线表、桥接源码里的方法名、
        # 以及 docs/EDITOR_AI_BRIDGE.md 的方法表四者互相对齐。
        run: node scripts/editor-mcp-check.mjs

      - name: 编辑器类型检查（editor 自身必须 0 错误，issue #133）
        # 为什么不直接跑 `npm run type-check` 看退出码：editor 通过 workspace 链接 import 的是
        # feng3d / polyfill 的**源码**，vue-tsc 会顺着 import 深检这些库，于是报出它们既有的类型
        # 错误（View.ts 的 canvas 断言、StandardMaterial.ts 的 TextureField 收窄、
        # ClassUtils.ts 的未使用 @ts-expect-error）。同一批文件在库自己的 tsc 下 0 错误，
        # 排查结论见 issue #133（两套 tsconfig 的 compilerOptions 逐项相同、只有一份 lib.dom.d.ts、
        # 同一 tsc 版本；单独编译 View.ts 不报，必须连同 editor/src 一起编译才报）。
        #
        # 直接看退出码的结果是"长期红着"，真问题（editor 自己的类型错误）反而被淹没。
        # `scripts/check-editor-types.mjs` 按路径分类：editor 自身必须 0、主仓噪音单列并打印摘要、
        # 未知来源同样失败——于是这一步可以是**阻塞**门禁。
        run: node scripts/check-editor-types.mjs

  editor-e2e:
    name: 编辑器（浏览器 e2e）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright chromium 及系统依赖
        # 用 playwright 自带的 chromium（而非系统 Chrome），保证 CI 与本地一致
        run: npx playwright install --with-deps chromium

      - name: 编辑器浏览器 e2e
        # 覆盖「产物能否真正立起来」——issue #145 的主界面白屏（产物里裸导入
        # "feng3d" 无法解析）正是这类纯逻辑测试漏掉的缺陷。
        # 用例内部会先构建编辑器产物，再起包内静态服务器（等价于用户 npx feng3d-editor）。
        run: npm run test:e2e:editor

      - name: 启动编辑器 dev server（AI 桥接需要）
        # 桥接中间件挂在 dev server 上（bridge/vitePlugin.mjs），静态服务器没有它。
        # `--strictPort`：端口被占用时直接失败并打出日志，而不是悄悄漂到 3001——
        # 漂移会让下面的就绪探测永远等不到，报出来的是"120s 超时"这种与真实原因无关的错。
        # 后台起服务后轮询 /ping 确认就绪，再进入下一步——固定 sleep 在 CI 上不可靠。
        # 进程在步骤结束后仍存活，由 runner 在 job 收尾时清理。
        # 就绪探测用 `localhost` 而不是 `127.0.0.1`：Vite 绑的是 `localhost`，
        # 在只解析到 IPv6 环回（::1）的环境里，回落到 `127.0.0.1` 会直接 ECONNREFUSED，
        # 报出来却是"120s 未就绪"。桥接脚本自己也用 `localhost`，两边保持一致。
        run: |
          npm run dev --workspace feng3d-editor -- --port 3000 --strictPort > /tmp/editor-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/__editor-bridge/ping > /dev/null; then
              echo "dev server 已就绪（等待 ${i} 轮）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::编辑器 dev server 未在 120s 内就绪"
          tail -n 80 /tmp/editor-dev.log
          exit 1

      - name: AI 桥接端到端验收（从零搭场景 + 导出/导入往返等价）
        # issue #150：判据是「交付是否成立」而不是「调用有没有报错」——
        # 结构自洽（scene.validate 无 error）、导出→导入**往返等价**、画面有内容。
        # `--open` 让脚本自己用 Playwright 开页面（桥接是页面轮询模型，没有页面就全部超时）。
        # 这台 runner 没有 GPU，判据三（像素）会被跳过而不是判失败。
        run: node scripts/editor-e2e-scene.mjs --open

      - name: 插件贡献表自洽（issue #168）
        # 单元测试（packages/editor/test/pluginTable.spec.ts）验的是表的**语义**，
        # 但表是通过 `editor.plugins` 桥接方法从**跑着的编辑器**里取出来的——
        # 注册表接线断了、面板没进布局、来源插件丢了，纯函数测试一个都发现不了。
        # 这里在真浏览器里取一次并校验：贡献点都有来源、来源都在插件列表里、id 唯一、落位已知。
        # 顺带守住 CLI（`--open` 路径）本身可用。
        run: node scripts/editor-plugins.mjs --open --check

      - name: 选中同步（重挂载后面板要自己恢复，issue #173）
        # 读选中的面板都是**异步加载**的组件，而"选中变化"是一次性事件：
        # 在组件挂载之前发生的选中它永远收不到（现象是「点了层级树、检查器一直空」，
        # 而且再点同一个对象也不会自愈）。单元测试只能扫源码守住"订阅方式对不对"，
        # 守不住"界面真的恢复了吗"——那要真点一下、真关掉面板、真开回来。
        run: node scripts/editor-selection-sync-check.mjs --open

      - name: 场景视图反复卸载/重建（引擎响应式稳定性，issue #177）
        # 关掉「场景」面板插件会卸载场景视图、打开会重建。反复几轮曾在无 GPU 的 runner 上
        # 稳定复现两条**引擎侧**报错：`RangeError: Maximum call stack size exceeded`
        # （ContainerLogic 的父子同步 effect 读了自己要写的 parentState，与批量刷新里的
        # computed 遍历互相递归）与 `Cannot read properties of undefined (reading 'elements')`
        # （读父级 logic 时没处理"还在构造中/类型未注册"）。
        # node 单测（SceneViewCycle.spec.ts）固定住"摘挂子树不抛异常"，但**复现不了那条爆栈**——
        # 它要真的卸载/重建编辑器视图，所以这条判据必须在真页面上跑。
        run: node scripts/editor-scene-view-cycle.mjs --open

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-report
          path: |
            .verify/editor-report/
            .verify/editor-output/
            /tmp/editor-dev.log
          retention-days: 7
