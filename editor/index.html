<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>feng3d-editor</title>
	<meta http-equiv="Access-Control-Allow-Origin" content="*" />
	<meta name="renderer" content="webkit">
	<meta name="viewport"
		content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="full-screen" content="true" />
	<meta name="screen-orientation" content="portrait" />
	<meta name="x5-fullscreen" content="true" />
	<meta name="360-fullscreen" content="true" />

	<link rel="stylesheet" href="./src/vue-app/styles/design-system.css">
	<style>
		html,
		body {
			background: var(--color-editor-bg); /* 使用设计系统颜色 */
			padding: 0;
			border: 0;
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			color: var(--color-text-secondary); /* 使用设计系统颜色 */
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
			transition: background-color 0.2s ease, color 0.2s ease;
		}

		/* 暗色主题样式 */
		html[data-theme="dark"] body {
			background: var(--color-editor-bg);
			color: var(--color-text-primary);
		}

		/* 亮色主题样式 */
		html[data-theme="light"] body {
			background: var(--color-gray-50);
			color: var(--color-gray-900);
		}
	</style>

	<!-- feng3d  -->
	<!-- <script src="./node_modules/feng3d/dist/index.js"></script> -->
	<script type="module" src="./src/vite-entry.ts"></script>
	<!-- 合并js -->
	<!-- <script src="index.js"></script> -->
</head>

<body>
	<!-- Vue 应用挂载点 -->
	<div id="vue-app" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
	<div id="output" style="position: absolute;display: none;top: 10px; right: 10px;z-index: 1000;background: white;padding: 10px;border-radius: 4px;box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>
</body>

</html>
