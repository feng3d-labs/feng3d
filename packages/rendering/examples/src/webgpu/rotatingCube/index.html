<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Rotating Cube - @feng3d/rendering</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            height: 100%;
            background: #1a1a1a;
        }

        /* 画布1：全屏 */
        #webgpu1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 画布2：左下角四分之一大小 (宽高各1/4) */
        #webgpu2 {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 25vw;
            height: 25vh;
            display: block;
            border: 2px solid #4a4a4a;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #webgpu2.hidden {
            display: none;
        }

        #webgpu2.hidden {
            display: none;
        }

        .canvas-label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <canvas id="webgpu1"></canvas>
    <div class="canvas-label" style="bottom: 10px; left: 10px;">画布 2 (左下角)</div>
    <canvas id="webgpu2"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script type="module" src="./index.ts"></script>
</body>

</html>
