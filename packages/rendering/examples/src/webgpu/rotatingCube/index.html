<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Rotating Cube - @feng3d/rendering</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
        }

        .controls {
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #4a4a4a;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background: #5a5a5a;
        }

        .canvas-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: row;
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
        }

        .canvas-label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        canvas.inactive {
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button id="switchCanvas">切换画布 (当前: 画布1)</button>
    </div>
    <div class="canvas-container">
        <div class="canvas-wrapper">
            <div class="canvas-label">画布 1</div>
            <canvas id="webgpu1"></canvas>
        </div>
        <div class="canvas-wrapper">
            <div class="canvas-label">画布 2</div>
            <canvas id="webgpu2" class="inactive"></canvas>
        </div>
    </div>
    <script type="module" src="./index.ts"></script>
</body>

</html>
