<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>GPU Driven Rendering - Simple Cube</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        :root {
            color-scheme: light dark;
        }
        html, body {
            margin: 0;
            height: 100%;
            display: flex;
            place-content: center center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
        }
        #description {
            max-width: 600px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1>GPU Driven Rendering</h1>
        <p id="description">
            This example demonstrates the GPU-driven rendering system using @feng3d/rendering.
            The GPU generates draw commands through compute shaders, performs frustum culling and LOD selection.
            Three rotating cubes are rendered with different materials.
        </p>
        <canvas id="webgpu" width="800" height="600"></canvas>
    </div>

    <script type="module" src="./index.ts"></script>
</body>

</html>
