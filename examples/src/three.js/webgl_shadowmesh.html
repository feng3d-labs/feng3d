<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>webgl_shadowmesh - feng3d</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 样式对齐 three.js examples/main.css（#info / 链接 / 按钮），保证页面覆盖层一致 */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body {
            background-color: #000;
            color: #fff;
            font-family: Monospace;
            font-size: 13px;
            line-height: 24px;
            overscroll-behavior: none;
        }
        a { color: #ff0; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { cursor: pointer; text-transform: uppercase; }
        #info {
            position: absolute;
            top: 0px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }
        a, button, input, select { pointer-events: auto; }
    </style>
</head>
<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - shadow mesh<br />
        <input id="lightButton" type="button" value="Switch to PointLight">
    </div>
    <canvas id="webgpu" style="width: 100%; height: 100%; display: block;"></canvas>
    <script type="module" src="./webgl_shadowmesh.ts"></script>
</body>
</html>
